<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Demande d'évolution — Boursauto</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --texte: var(--tg-theme-text-color, #1a1a1a);
    --aide: var(--tg-theme-hint-color, #8a8a8a);
    --champ: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-texte: var(--tg-theme-button-text-color, #ffffff);
    --erreur: #d64545;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 16px 96px; background: var(--bg); color: var(--texte);
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; font-weight: 600; margin: 4px 0 4px; }
  .intro { color: var(--aide); font-size: 14px; margin: 0 0 20px; }
  label { display: block; font-weight: 600; font-size: 15px; margin: 18px 0 4px; }
  .aide { display: block; color: var(--aide); font-weight: 400; font-size: 13px; margin-top: 2px; }
  input, textarea { width: 100%; border: 1px solid transparent; border-radius: 10px; padding: 11px 12px;
         background: var(--champ); color: var(--texte); font: inherit; outline: none; }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 84px; resize: vertical; }
  .priorites { display: flex; gap: 8px; margin-top: 6px; }
  .priorites button { flex: 1; padding: 10px 0; border-radius: 10px; border: 1px solid var(--champ);
         background: var(--champ); color: var(--texte); font: inherit; font-size: 15px; cursor: pointer; }
  .priorites button.actif { background: var(--accent); color: var(--accent-texte); border-color: var(--accent); }
  .obligatoire::after { content: " *"; color: var(--erreur); }
  .erreur-champ { border-color: var(--erreur) !important; }
  #message-erreur { color: var(--erreur); font-size: 14px; margin-top: 16px; min-height: 20px; }
  #envoyer-secours { display: none; width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 10px;
         background: var(--accent); color: var(--accent-texte); font: inherit; font-weight: 600; }
</style>
</head>
<body>
  <h1>Demande d'évolution</h1>
  <p class="intro">Boursauto — décris ce que tu veux, en langage courant.</p>

  <form id="formulaire" novalidate>
    <label for="titre" class="obligatoire">Titre</label>
    <input id="titre" maxlength="100" placeholder="Ex. : Alerte Telegram à chaque achat">

    <label for="quoi" class="obligatoire">Ce que je veux changer</label>
    <textarea id="quoi" maxlength="1000"></textarea>

    <label for="pourquoi" class="obligatoire">Pourquoi</label>
    <textarea id="pourquoi" maxlength="600"></textarea>

    <label for="verification" class="obligatoire">Comment je vérifierai que ça marche
      <span class="aide">Ce que tu verras quand ce sera fait.</span></label>
    <textarea id="verification" maxlength="600"></textarea>

    <label for="intouchable">Ce qui ne doit surtout pas bouger
      <span class="aide">Facultatif.</span></label>
    <textarea id="intouchable" maxlength="600"></textarea>

    <label>Priorité</label>
    <div class="priorites" role="radiogroup">
      <button type="button" data-valeur="basse">Basse</button>
      <button type="button" data-valeur="moyenne" class="actif">Moyenne</button>
      <button type="button" data-valeur="haute">Haute</button>
    </div>

    <div id="message-erreur" role="alert"></div>
    <button type="submit" id="envoyer-secours">Envoyer la demande</button>
  </form>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  let priorite = "moyenne";

  document.querySelectorAll(".priorites button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".priorites button").forEach(x => x.classList.remove("actif"));
    b.classList.add("actif");
    priorite = b.dataset.valeur;
  }));

  const obligatoires = ["titre", "quoi", "pourquoi", "verification"];
  obligatoires.forEach(id => document.getElementById(id).addEventListener("input", e => {
    e.target.classList.remove("erreur-champ");
    document.getElementById("message-erreur").textContent = "";
  }));

  function envoyer() {
    const val = id => document.getElementById(id).value.trim();
    const manquants = obligatoires.filter(id => !val(id));
    if (manquants.length) {
      manquants.forEach(id => document.getElementById(id).classList.add("erreur-champ"));
      document.getElementById("message-erreur").textContent = "Remplis les champs marqués d'une étoile.";
      document.getElementById(manquants[0]).focus();
      return;
    }
    const donnees = { type: "demande_evolution", v: 1, titre: val("titre"), quoi: val("quoi"),
      pourquoi: val("pourquoi"), verification: val("verification"), intouchable: val("intouchable"), priorite };
    const json = JSON.stringify(donnees);
    if (new TextEncoder().encode(json).length > 4000) {
      document.getElementById("message-erreur").textContent = "Texte trop long : raccourcis un peu tes réponses.";
      return;
    }
    if (tg && tg.sendData) { tg.sendData(json); }
    else { document.getElementById("message-erreur").textContent = "Ouvre ce formulaire depuis le bot Telegram."; }
  }

  document.getElementById("formulaire").addEventListener("submit", e => { e.preventDefault(); envoyer(); });

  if (tg && tg.initData !== undefined && tg.MainButton) {
    tg.ready(); tg.expand();
    tg.MainButton.setText("Envoyer la demande");
    tg.MainButton.show();
    tg.MainButton.onClick(envoyer);
  } else {
    document.getElementById("envoyer-secours").style.display = "block";
  }
</script>
</body>
</html>
